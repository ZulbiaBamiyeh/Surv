<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Isometric Ink Mockup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" />

  <body>
    <div id="app"></div>
    <div class="hud">
      <div class="hp"><i></i><span></span></div>
      <div class="height">Height <b>0</b></div>
      <div class="help">
        <span class="keys-only"><b>WASD</b> move · <b>Space</b> jump up a ledge · <b>Shift</b> dash · big drops hurt</span>

      </div>
      <div class="touch-btns"><button class="tb jump" type="button">Jump</button><button class="tb dash" type="button">Dash</button></div>
    </div>
    <script type="module" src="/src/iso/main.ts"></script>
